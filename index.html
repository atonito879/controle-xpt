<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle XPT</title>
<style>
:root{color-scheme:dark;--bg:#050505;--card:#151515;--line:#303030;--green:#168443;--red:#a83232;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font-family:Arial,sans-serif;padding:12px;max-width:760px;margin:auto}h1{text-align:center;margin:8px 0 4px;font-size:25px}.sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0}h2{font-size:17px;margin:0 0 12px}label{font-size:13px;color:#ccc;display:block;margin-bottom:5px}input,select{width:100%;padding:11px;background:#222;color:#fff;border:1px solid #414141;border-radius:8px;font-size:16px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center}.row input{flex:1;min-width:0}.btn{border:0;border-radius:8px;padding:11px 13px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;touch-action:manipulation}.btn:active{filter:brightness(1.25);transform:scale(.98)}.plus{background:var(--green)}.minus{background:#555}.delete{background:var(--red)}.neutral{background:#303030}.small{padding:7px 10px;font-size:13px}.counter{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333;gap:8px}.counter:last-child{border-bottom:0}.count{font-size:20px;font-weight:bold;min-width:34px;text-align:center}.actions{display:flex;gap:7px;align-items:center}.code{font-weight:bold;font-size:16px;flex:1}.totalrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}.totalrow:last-child{border:0}.bigTotal{font-size:22px;font-weight:bold;color:#8be2a6}.empty{color:#999;text-align:center;padding:10px}.btnwide{width:100%;margin-top:8px}.duration{color:#9fe2b3;font-size:13px;margin-top:4px;line-height:1.6}.result{white-space:pre-wrap;background:#101010;border:1px solid #333;border-radius:8px;padding:12px;font-size:14px;line-height:1.5}
@media(max-width:420px){body{padding:10px}.btn{padding:10px}.actions{gap:5px}}
</style></head><body>
<h1>CONTROLE XPT</h1><div class="sub">Controle de expedição e carregamento</div>
<section class="card"><h2>Dados do carregamento</h2><div class="grid">
<div><label for="date">Data</label><input type="date" id="date"></div><div><label for="period">Período</label><select id="period"><option>AM</option><option>PM</option></select></div>
<div><label for="dock">Doca</label><input id="dock" placeholder="Número da doca" inputmode="numeric"></div><div><label for="carrier">Transportadora</label><input id="carrier" placeholder="Transportadora"></div>
<div class="full"><label for="plate">Placa do caminhão</label><input id="plate" placeholder="ABC1D23" autocapitalize="characters"></div><div class="full"><label for="destination">Destino do XPT</label><input id="destination" placeholder="Digite o destino do carregamento"></div></div></section>
<section class="card"><h2>Horários da operação</h2><div class="grid">
<div><label for="start">Início do carregamento</label><input type="text" id="start" class="clock" inputmode="numeric" maxlength="5" placeholder="08:00"></div>
<div><label for="finish">Fim do carregamento</label><input type="text" id="finish" class="clock" inputmode="numeric" maxlength="5" placeholder="10:30"></div></div>
<div id="durations" class="duration">Informe o início e o fim para calcular o tempo de carregamento.</div></section>
<section class="card"><h2>Mangas</h2><div class="row"><input id="code" placeholder="Código (ex.: I2, G1, H3)" autocapitalize="characters"><button type="button" class="btn plus" id="add">Adicionar</button></div><div id="mangas"></div></section>
<section class="card"><h2>BIGs</h2><div class="counter"><span>Quantidade de BIGs</span><div class="actions"><button type="button" class="btn minus" data-counter="bigs" data-delta="-1">−1</button><span class="count" id="bigs">0</span><button type="button" class="btn plus" data-counter="bigs" data-delta="1">+1</button></div></div></section>
<section class="card"><h2>Gaiolas</h2><div class="counter"><span>Quantidade de gaiolas</span><div class="actions"><button type="button" class="btn minus" data-counter="cages" data-delta="-1">−1</button><span class="count" id="cages">0</span><button type="button" class="btn plus" data-counter="cages" data-delta="1">+1</button></div></div></section>
<section class="card"><h2>Resumo do carregamento</h2><div id="summary"></div><button type="button" class="btn plus btnwide" id="copy">Copiar relatório para WhatsApp</button><button type="button" class="btn delete btnwide" id="reset">Limpar carregamento / novo</button></section>
<script>
(function(){
'use strict';
const byId=(id)=>document.getElementById(id);
const STORAGE='xpt-control-v2';
let state={mangas:{},bigs:0,cages:0,meta:{}};
const fields=['date','period','dock','carrier','plate','destination','start','finish'];
function meta(){const m={};fields.forEach(id=>m[id]=byId(id).value);return m;}
function save(){state.meta=meta();try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(_e){} render();}
function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&typeof saved==='object')state={mangas:saved.mangas||{},bigs:Number(saved.bigs)||0,cages:Number(saved.cages)||0,meta:saved.meta||{}};}catch(_e){} fields.forEach(id=>{if(state.meta[id]!==undefined)byId(id).value=state.meta[id];});if(!byId('date').value)byId('date').value=new Date().toISOString().slice(0,10);render();}
function addCode(){const input=byId('code'),code=input.value.trim().toUpperCase().replace(/\s+/g,'');if(!code)return;state.mangas[code]=(Number(state.mangas[code])||0)+1;input.value='';save();input.focus();}
function minutes(a,b){if(!a||!b)return null;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let x=h1*60+m1,y=h2*60+m2;if(y<x)y+=1440;return y-x;}
function duration(n){return n===null?'—':Math.floor(n/60)+'h '+String(n%60).padStart(2,'0')+'min';}
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function render(){byId('bigs').textContent=state.bigs;byId('cages').textContent=state.cages;const codes=Object.keys(state.mangas).sort();
byId('mangas').innerHTML=codes.length?codes.map(c=>`<div class="counter"><span class="code">${esc(c)}</span><div class="actions"><button type="button" class="btn minus small" data-code="${esc(c)}" data-delta="-1">−1</button><span class="count">${Number(state.mangas[c])||0}</span><button type="button" class="btn plus small" data-code="${esc(c)}" data-delta="1">+1</button><button type="button" class="btn delete small" data-remove="${esc(c)}">×</button></div></div>`).join(''):'<div class="empty">Nenhuma manga adicionada</div>';
const mt=codes.reduce((sum,c)=>sum+(Number(state.mangas[c])||0),0),total=mt+state.bigs+state.cages;
byId('summary').innerHTML=codes.map(c=>`<div class="totalrow"><span>${esc(c)}</span><strong>${Number(state.mangas[c])||0}</strong></div>`).join('')+`<div class="totalrow"><span>Total mangas</span><strong>${mt}</strong></div><div class="totalrow"><span>BIGs</span><strong>${state.bigs}</strong></div><div class="totalrow"><span>Gaiolas</span><strong>${state.cages}</strong></div><div class="totalrow bigTotal"><span>TOTAL GERAL</span><strong>${total}</strong></div>`;
const m=meta();byId('durations').textContent=`Tempo de carregamento: ${duration(minutes(m.start,m.finish))}`;
}
function makeReport(){const m=meta(),codes=Object.keys(state.mangas).sort(),mt=codes.reduce((sum,c)=>sum+(Number(state.mangas[c])||0),0),total=mt+state.bigs+state.cages;return `FECHAMENTO XPT\nData: ${m.date||'—'}\nPeríodo: ${m.period||'—'}\nDoca: ${m.dock||'—'}\nTransportadora: ${m.carrier||'—'}\nPlaca: ${m.plate||'—'}\nDestino do XPT: ${m.destination||'—'}\n\nHORÁRIOS\nInício do carregamento: ${m.start||'—'}\nFim do carregamento: ${m.finish||'—'}\nTempo de carregamento: ${duration(minutes(m.start,m.finish))}\n\nMANGAS\n${codes.map(c=>`${c} - ${state.mangas[c]}`).join('\n')||'Nenhuma'}\nTotal mangas: ${mt}\nBIGs: ${state.bigs}\nGaiolas: ${state.cages}\nTOTAL GERAL: ${total}`;}
// Event delegation: mantém os cliques funcionando mesmo após redesenhar os contadores.
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;
if(button.id==='add'){addCode();return;}
if(button.dataset.counter){const k=button.dataset.counter,delta=Number(button.dataset.delta)||0;state[k]=Math.max(0,(Number(state[k])||0)+delta);save();return;}
if(button.dataset.code!==undefined){const c=button.dataset.code;state.mangas[c]=Math.max(0,(Number(state.mangas[c])||0)+(Number(button.dataset.delta)||0));if(!state.mangas[c])delete state.mangas[c];save();return;}
if(button.dataset.remove!==undefined){delete state.mangas[button.dataset.remove];save();return;}
if(button.id==='copy'){const report=makeReport();try{await navigator.clipboard.writeText(report);button.textContent='Relatório copiado!';setTimeout(()=>button.textContent='Copiar relatório para WhatsApp',1600);}catch(_e){const area=document.createElement('textarea');area.value=report;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();alert('Relatório copiado. Cole no WhatsApp.');}return;}
if(button.id==='reset'&&confirm('Limpar todos os dados deste carregamento e começar outro?')){state={mangas:{},bigs:0,cages:0,meta:{}};try{localStorage.removeItem(STORAGE);}catch(_e){}fields.forEach(id=>byId(id).value='');byId('date').value=new Date().toISOString().slice(0,10);byId('period').value='AM';save();}
});
byId('code').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();addCode();}});
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',save));
// Horários em campo simples: digite 4 números (ex.: 0830) e ele formata para 08:30.
document.querySelectorAll('.clock').forEach(el=>el.addEventListener('input',()=>{let digits=el.value.replace(/\D/g,'').slice(0,4);if(digits.length>=3)el.value=digits.slice(0,2)+':'+digits.slice(2);else el.value=digits;save();}));
load();
})();
</script></body></html>
