<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle XPT</title>
<style>
:root{color-scheme:dark;--bg:#050505;--card:#151515;--line:#303030;--green:#168443;--red:#a83232;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font-family:Arial,sans-serif;padding:14px;max-width:760px;margin:auto}h1{text-align:center;margin:8px 0 4px;font-size:25px} .sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0}h2{font-size:17px;margin:0 0 12px}label{font-size:13px;color:#ccc;display:block;margin-bottom:5px}input,select{width:100%;padding:11px;background:#222;color:#fff;border:1px solid #414141;border-radius:8px;font-size:16px;margin-bottom:10px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center}.row input{flex:1;min-width:0}.btn{border:0;border-radius:8px;padding:11px 13px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer}.plus{background:var(--green)}.minus{background:#555}.delete{background:var(--red)}.neutral{background:#303030}.small{padding:7px 10px;font-size:13px}.counter{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333;gap:8px}.counter:last-child{border-bottom:0}.count{font-size:20px;font-weight:bold;min-width:34px;text-align:center}.actions{display:flex;gap:7px;align-items:center}.code{font-weight:bold;font-size:16px;flex:1}.totalrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}.totalrow:last-child{border:0}.bigTotal{font-size:22px;font-weight:bold;color:#8be2a6}.hint{color:#aaa;font-size:12px;margin-top:5px}.result{white-space:pre-wrap;background:#101010;border:1px solid #333;border-radius:8px;padding:12px;font-size:14px;line-height:1.5}.btnwide{width:100%;margin-top:8px}.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timegrid input{margin-bottom:0}.timegrid label{margin-bottom:5px}.timebox{margin-bottom:10px}.empty{color:#999;text-align:center;padding:10px}.duration{color:#9fe2b3;font-size:13px;margin-top:4px}.headerline{display:flex;justify-content:space-between;align-items:center}
@media(max-width:420px){body{padding:10px}.grid{gap:7px}.btn{padding:10px}.actions{gap:5px}}
</style></head><body>
<h1>CONTROLE XPT</h1><div class="sub">Controle de expedição e carregamento</div>
<section class="card"><h2>Dados do carregamento</h2><div class="grid">
<div><label>Data</label><input type="date" id="date"></div><div><label>Período</label><select id="period"><option>AM</option><option>PM</option></select></div>
<div><label>Doca</label><input id="dock" placeholder="Número da doca" inputmode="numeric"></div><div><label>Transportadora</label><input id="carrier" placeholder="Transportadora"></div>
<div class="full"><label>Placa do caminhão</label><input id="plate" placeholder="ABC1D23" autocapitalize="characters"></div></div></section>
<section class="card"><h2>Horários da operação</h2><div class="grid">
<div class="timebox"><label>Chegada na doca</label><input type="time" id="arrival"></div><div class="timebox"><label>Início do carregamento</label><input type="time" id="start"></div>
<div class="timebox"><label>Fim do carregamento</label><input type="time" id="finish"></div><div class="timebox"><label>Saída da doca</label><input type="time" id="exit"></div></div>
<div id="durations" class="duration">Preencha os horários para calcular os tempos.</div></section>
<section class="card"><div class="headerline"><h2>Mangas</h2></div><div class="row"><input id="code" placeholder="Código (ex.: I2, G1, H3)" autocapitalize="characters"><button class="btn plus" id="add">Adicionar</button></div><div id="mangas"></div></section>
<section class="card"><h2>BIGs</h2><div class="counter"><span>Quantidade de BIGs</span><div class="actions"><button class="btn minus" data-step="bigs" data-delta="-1">−1</button><span class="count" id="bigs">0</span><button class="btn plus" data-step="bigs" data-delta="1">+1</button></div></div></section>
<section class="card"><h2>Gaiolas</h2><div class="counter"><span>Quantidade de gaiolas</span><div class="actions"><button class="btn minus" data-step="cages" data-delta="-1">−1</button><span class="count" id="cages">0</span><button class="btn plus" data-step="cages" data-delta="1">+1</button></div></div></section>
<section class="card"><h2>Resumo do carregamento</h2><div id="summary"></div><button class="btn plus btnwide" id="copy">Copiar relatório para WhatsApp</button><button class="btn delete btnwide" id="reset">Limpar carregamento / novo</button></section>
<script>
const $=id=>document.getElementById(id);let data={mangas:{},bigs:0,cages:0,meta:{}};unction readMeta(){return Object.fromEntries(['date','period','dock','carrier','plate','arrival','start','finish','exit'].map(k=>[k,$(k).value]));}
function save(){data.meta=readMeta();localStorage.setItem('xpt-control-v2',JSON.stringify(data));render();}
function load(){try{let s=JSON.parse(localStorage.getItem('xpt-control-v2')||'{}');if(s&&typeof s==='object')data={mangas:s.mangas||{},bigs:+s.bigs||0,cages:+s.cages||0,meta:s.meta||{}};}catch(e){};Object.entries(data.meta).forEach(([k,v])=>{if($(k))$(k).value=v||''});if(!$('date').value)$('date').value=new Date().toISOString().slice(0,10);render();}
function addCode(){let c=$('code').value.trim().toUpperCase().replace(/\s+/g,'');if(!c)return;data.mangas[c]=(data.mangas[c]||0)+1;$('code').value='';$('code').focus();save();}
$('add').onclick=addCode;$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCode();}});
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let k=b.dataset.step;data[k]=Math.max(0,(+data[k]||0)+(+b.dataset.delta));save();});
function mins(a,b){if(!a||!b)return null;let [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let x=h1*60+m1,y=h2*60+m2;if(y<x)y+=1440;return y-x;}
function fmt(n){if(n==null)return '—';return `${Math.floor(n/60)}h ${String(n%60).padStart(2,'0')}min`;}
function render(){ $('bigs').textContent=data.bigs;$('cages').textContent=data.cages;let codes=Object.keys(data.mangas).sort();$('mangas').innerHTML=codes.length?codes.map(c=>`<div class="counter"><span class="code">${esc(c)}</span><div class="actions"><button class="btn minus small" data-code="${esc(c)}" data-d="-1">−1</button><span class="count">${data.mangas[c]}</span><button class="btn plus small" data-code="${esc(c)}" data-d="1">+1</button><button class="btn delete small" data-del="${esc(c)}">×</button></div></div>`).join(''):'<div class="empty">Nenhuma manga adicionada</div>';
$('mangas').querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{let c=b.dataset.code;data.mangas[c]=Math.max(0,data.mangas[c]+(+b.dataset.d));if(!data.mangas[c])delete data.mangas[c];save();});$('mangas').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete data.mangas[b.dataset.del];save();});
let total=Object.values(data.mangas).reduce((a,b)=>a+b,0)+data.bigs+data.cages;let lines=codes.map(c=>`<div class="totalrow"><span>${esc(c)}</span><strong>${data.mangas[c]}</strong></div>`).join('');$('summary').innerHTML=lines+`<div class="totalrow"><span>Total mangas</span><strong>${Object.values(data.mangas).reduce((a,b)=>a+b,0)}</strong></div><div class="totalrow"><span>BIGs</span><strong>${data.bigs}</strong></div><div class="totalrow"><span>Gaiolas</span><strong>${data.cages}</strong></div><div class="totalrow bigTotal"><span>TOTAL GERAL</span><strong>${total}</strong></div>`;
let m=readMeta();let w=mins(m.arrival,m.start),load=mins(m.start,m.finish),stay=mins(m.arrival,m.exit);$('durations').innerHTML=`Espera: ${fmt(w)} &nbsp;|&nbsp; Carregamento: ${fmt(load)} &nbsp;|&nbsp; Permanência na doca: ${fmt(stay)}`;}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',save));
$('copy').onclick=async()=>{let m=readMeta(), total=Object.values(data.mangas).reduce((a,b)=>a+b,0)+data.bigs+data.cages;let report=`FECHAMENTO XPT\nData: ${m.date||'—'}\nPeríodo: ${m.period||'—'}\nDoca: ${m.dock||'—'}\nTransportadora: ${m.carrier||'—'}\nPlaca: ${m.plate||'—'}\n\nHORÁRIOS\nChegada na doca: ${m.arrival||'—'}\nInício do carregamento: ${m.start||'—'}\nFim do carregamento: ${m.finish||'—'}\nSaída da doca: ${m.exit||'—'}\nEspera: ${fmt(mins(m.arrival,m.start))}\nTempo de carregamento: ${fmt(mins(m.start,m.finish))}\nPermanência na doca: ${fmt(mins(m.arrival,m.exit))}\n\nMANGAS\n${Object.keys(data.mangas).sort().map(c=>`${c} - ${data.mangas[c]}`).join('\n')||'Nenhuma'}\nTotal mangas: ${Object.values(data.mangas).reduce((a,b)=>a+b,0)}\nBIGs: ${data.bigs}\nGaiolas: ${data.cages}\nTOTAL GERAL: ${total}`;try{await navigator.clipboard.writeText(report);$('copy').textContent='Relatório copiado!';setTimeout(()=>$('copy').textContent='Copiar relatório para WhatsApp',1800);}catch(e){let t=document.createElement('textarea');t.value=report;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Relatório copiado. Cole no WhatsApp.');}};
$('reset').onclick=()=>{if(confirm('Limpar todos os dados deste carregamento e começar outro?')){data={mangas:{},bigs:0,cages:0,meta:{}};localStorage.removeItem('xpt-control-v2');['dock','carrier','plate','arrival','start','finish','exit'].forEach(k=>$(k).value='');$('date').value=new Date().toISOString().slice(0,10);$('period').value='AM';save();}};
load();
</script></body></html>
